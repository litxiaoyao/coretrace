[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coretrace"
version = "0.1.0"
description = "Mechanistic analysis and repair of contextual multi-hop composition"
requires-python = ">=3.11"
dependencies = ["torch==2.9.1", "transformers==4.57.6", "tokenizers==0.22.2", "safetensors==0.8.0", "numpy>=2,<3", "pyarrow>=18", "matplotlib>=3.9", "huggingface-hub>=0.34"]

[tool.setuptools.packages.find]
include = ["coretrace*"]

[tool.setuptools.package-data]
"coretrace.data.builders" = ["selection.json"]
